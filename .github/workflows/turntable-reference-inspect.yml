name: Inspect turntable reference assets
on:
  push:
    branches: [feature/fullscreen-turntable-scene]
    paths:
      - '.github/workflows/turntable-reference-inspect.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download creator's published editor project
        run: |
          python -m pip install --quiet gdown
          gdown 1ttlr5Njnquds4rphMHswB4cVPT6f2uAW -O /tmp/dynamic-record-player.zip
      - name: Print safe project resource inventory
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          z = ZipFile('/tmp/dynamic-record-player.zip')
          print('Zip entries:', len(z.infolist()))
          for i in z.infolist():
              if i.is_dir(): continue
              print(f'{i.file_size:>10} {i.filename[:160]}')
          PY


      - name: Inspect exact texture dimensions and scene layout
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from zipfile import ZipFile
          from PIL import Image
          from io import BytesIO
          import json
          z=ZipFile('/tmp/dynamic-record-player.zip')
          prefix='dynamic_record_player/'
          for name in z.namelist():
              if name.startswith(prefix+'materials/') and name.endswith('.png') and '/masks/' not in name:
                  img=Image.open(BytesIO(z.read(name)))
                  print('TEXTURE',name, img.size, img.mode, 'alpha bbox', img.getchannel('A').getbbox() if 'A' in img.mode else None)
          scene=json.loads(z.read(prefix+'scene.json'))
          print('SCENE KEYS',list(scene.keys()))
          for key,value in scene.items():
              if key=='objects' and isinstance(value,list):
                  for o in value: print('OBJECT',json.dumps(o,ensure_ascii=False)[:3500])
              elif key not in ('objects',):
                  print('SCENE FIELD',key,json.dumps(value,ensure_ascii=False)[:1500])
          PY

      - name: Prepare source-derived WebP layer textures
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from PIL import Image
          from pathlib import Path
          from io import BytesIO
          z=ZipFile('/tmp/dynamic-record-player.zip')
          out=Path('public/fullscreen-turntable')
          out.mkdir(parents=True,exist_ok=True)
          for key,filename in {
              'background': 'turntable base.png',
              'vinyl': 'vinyl.png',
              'tonearm': 'arm.png',
              'spindle': 'pin.png',
              'label-overlay': 'vinyl_overlay.png',
              'vinyl-blur': 'black_vinyl_blurred.png',
          }.items():
              image=Image.open(BytesIO(z.read('dynamic_record_player/materials/'+filename)))
              image.save(out/(key+'.webp'), 'WEBP',quality=94,method=6)
              print('Optimized',key,(out/(key+'.webp')).stat().st_size)
          PY
      - name: Import source-derived artwork in this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fullscreen-turntable
          if ! git diff --cached --quiet; then
            git commit -m "assets(fullscreen): import original record player scene textures"
            git push origin HEAD:feature/fullscreen-turntable-scene
          fi
