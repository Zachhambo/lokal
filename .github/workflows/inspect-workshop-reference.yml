name: Inspect wallpaper thumbnail
on:
  push:
    branches: [feature/fullscreen-turntable-scene]
    paths: [.github/workflows/inspect-workshop-reference.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch candidate thumbnail
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from io import BytesIO
          import base64
          u='https://images.steamusercontent.com/ugc/1874087573729316926/29B29E7311CD539E586F8B5150D3F633A0B3D55A/'
          content=urlopen(Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
          print('IMAGE_SIZE',len(content))
          from PIL import Image
          img=Image.open(BytesIO(content)).convert('RGB');img.thumbnail((600,350))
          out=BytesIO();img.save(out,'JPEG',quality=70)
          print('IMAGE_B64_START')
          print(base64.b64encode(out.getvalue()).decode())
          print('IMAGE_B64_END')
          PY