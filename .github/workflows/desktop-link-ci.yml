name: Desktop link regression

on:
  pull_request:
    paths:
      - 'electron/link/**'
      - 'server/index.js'
      - 'scripts/link-persistence.test.mjs'
      - 'scripts/link-device-names.test.mjs'
      - 'src/components/LinkedDevicesPanel.jsx'
      - 'electron/main.js'
      - 'electron/preload.js'
      - 'electron/network/**'
      - 'electron/ipc/remote.js'
      - 'scripts/link-lan-discovery.test.cjs'
      - 'scripts/cast-discovery.test.mjs'
      - 'scripts/desktop-link-playlist-reconcile.test.mjs'
      - 'scripts/mobile-history-artwork.test.mjs'
      - 'package.json'
      - '.github/workflows/desktop-link-ci.yml'

permissions:
  contents: read

jobs:
  playlist-reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check desktop link syntax
        run: |
          node --check electron/link/index.js
          node --check electron/link/reconcile.js
          node --check electron/network/lanInterfaces.js
          node --check electron/network/mdns.js
      - name: Test LAN pairing and shared multicast routing
        run: node --test scripts/link-lan-discovery.test.cjs scripts/cast-discovery.test.mjs
      - name: Test desktop playlist synchronization
        run: npm run test:desktop-link-playlists
      - name: Test mobile history attribution and artwork guards
        run: npm run test:mobile-history-artwork
      - name: Test durable pairing and authenticated address discovery
        run: node --experimental-sqlite --test scripts/link-persistence.test.mjs scripts/link-device-names.test.mjs
