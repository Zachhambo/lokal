name: Release Lokal

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the current published/package version
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version (optional; overrides bump)
        required: false
        default: ''
      publish:
        description: Publish the completed release (off leaves a draft)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-lokal
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    name: Select version and source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          EXACT_VERSION: ${{ inputs.version }}
        run: python3 scripts/desktop_releases.py prepare --bump "$BUMP" --version "$EXACT_VERSION"

  build:
    needs: prepare
    strategy:
      # A Windows bootstrap/network failure must not cancel the Linux and
      # macOS artifacts. The release still waits for all builds to succeed.
      fail-fast: false
      matrix:
        # Linux stays on a fixed, older Ubuntu: native modules compiled here
        # only run on systems at least this new, so a newer image would
        # lock older distros out of the AppImage/deb.
        # ubuntu-24.04-arm: the Linux AppImage/deb for ARM64 (Raspberry Pi 5,
        # ARM laptops), built natively there; its files carry "arm64" and the
        # updater reads latest-linux-arm64.yml, so nothing clashes with x64.
        # macos-latest builds for Apple silicon (arm64), macos-15-intel for
        # Intel Macs (x64): each natively, so native modules match. Their
        # files don't clash (the arm64 ones carry "arm64"); the updater files
        # are merged into one latest-mac.yml (scripts/merge-latest-mac.mjs).
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Apply the selected package version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm pkg set version="$RELEASE_VERSION"

      - name: Setup Rust (for Windows SMTC bridge)
        # Must run before "Install Dependencies": this repo's postinstall
        # script (electron-builder install-app-deps && npm run
        # native:prepare) invokes `cargo build` for the SMTC bridge addon
        # as part of `npm install` itself, so cargo has to already be on
        # PATH by then, not just before a later separate build step.
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Check preinstalled .NET 8 SDK
        # windows-latest includes .NET 8. Avoid an unconditional
        # setup-dotnet download: run 40229927366 failed before npm install
        # because both the 10.0 runtime and 8.0 SDK blob URLs returned 409.
        # This also detects image changes, preserving a conditional fallback.
        if: matrix.os == 'windows-latest'
        id: dotnet_sdk
        shell: pwsh
        run: |
          # Treat a missing/broken dotnet CLI as "not installed" so the
          # conditional setup-dotnet fallback can restore it.
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) {
            "installed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $installed = @(dotnet --list-sdks)
          if ($LASTEXITCODE -ne 0) {
            "installed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $installed | ForEach-Object { Write-Host $_ }
          $has8 = @($installed | Where-Object { $_ -match '^8\.0\.\d+\s' }).Count -gt 0
          "installed=$($has8.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install .NET 8 only when missing
        # npm install builds tools/webview2-signin via native:prepare.
        if: matrix.os == 'windows-latest' && steps.dotnet_sdk.outputs.installed != 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Verify Windows .NET SDK
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          if ($LASTEXITCODE -ne 0 -or -not @($sdks | Where-Object { $_ -match '^8\.0\.\d+\s' }).Count) {
            throw '.NET 8 SDK is required to build the Windows WebView2 sign-in helper'
          }
          Write-Host "Using preinstalled or restored .NET 8 SDK:"
          $sdks | Where-Object { $_ -match '^8\.0\.\d+\s' }

      - name: Install Dependencies
        run: npm install

      # npm skips an optional package whose download fails (it happens on a
      # cold npm cache) and carries on, which left Windows without
      # lightningcss-win32-x64-msvc and failed the vite build. A second
      # install fetches whatever is missing; the check fails the job early
      # if that didn't help.
      - name: Check the build tools' native parts
        shell: bash
        run: |
          node scripts/check-build-natives.cjs && exit 0
          echo "::warning::A native build package is missing after npm install; installing again."
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/check-build-natives.cjs

      # The Windows build also makes the Microsoft Store MSIX. Its identity
      # comes from package.json (build.appx), matching Partner Center's
      # Product identity; the MSIX_IDENTITY_NAME, MSIX_PUBLISHER and
      # MSIX_PUBLISHER_DISPLAY_NAME repository variables override it if set.
      # The MSIX is left unsigned: the Store signs it.
      - name: Build Application
        if: runner.os != 'macOS'
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          ARGS=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$MSIX_IDENTITY_NAME" ]; then ARGS+=(-c.appx.identityName "$MSIX_IDENTITY_NAME"); fi
            if [ -n "$MSIX_PUBLISHER" ]; then ARGS+=(-c.appx.publisher "$MSIX_PUBLISHER"); fi
            if [ -n "$MSIX_PUBLISHER_DISPLAY_NAME" ]; then ARGS+=(-c.appx.publisherDisplayName "$MSIX_PUBLISHER_DISPLAY_NAME"); fi
          fi
          npm run build -- --publish never "${ARGS[@]}"

      - name: Check the MSIX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          shopt -s nullglob
          msix=(release/*.msix)
          [ ${#msix[@]} -gt 0 ] || { echo "::error::No .msix was built."; exit 1; }
          ls -l "${msix[@]}"

      # The MSIX is unsigned (the Store signs it), so Windows won't install a
      # downloaded copy: it's kept as a workflow artifact for uploading to
      # Partner Center, not published on the GitHub release.
      - name: Upload the Store MSIX
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: store-msix
          path: release/*.msix
          if-no-files-found: error

      - name: Keep the MSIX off the release
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f release/*.msix

      - name: Verify AppImage libvips resolver tests
        if: runner.os == 'Linux'
        run: node --test scripts/check-linux-sharp-appimage.test.cjs

      # Verify the actual AppImage, not just installed node_modules.
      # Missing libvips made AppImages fail on CachyOS (sipbuu/lokal#521).
      - name: Verify Sharp and libvips inside AppImage
        if: runner.os == 'Linux'
        run: node scripts/check-linux-sharp-appimage.cjs release

      # macOS: two runners (Apple silicon and Intel). Signing only happens
      # when the certificate secrets exist: an empty CSC_LINK makes
      # electron-builder read the project folder as the certificate ("not a
      # file") and fail, which is what broke the mac build in #277. Without
      # them, the app is signed ad-hoc (see below).
      # DMG creation (hdiutil) fails now and then on hosted runners with
      # "Resource busy"; one clean retry covers it.
      - name: Build Application (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          SIGN_ARGS=()
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            echo "Signing with the configured certificate."
          else
            # Ad-hoc signature over the whole bundle. Without it the app kept
            # Electron's stale signature ("code has no resources but signature
            # indicates they must be present"), which macOS reports as a
            # damaged app on Apple silicon. The hardened runtime only matters
            # for notarization, and with an ad-hoc signature it makes macOS
            # refuse to load the app's own native modules.
            SIGN_ARGS=(-c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false)
            echo "No signing certificate configured; signing ad-hoc."
          fi
          for attempt in 1 2; do
            if npm run build -- --publish never "${SIGN_ARGS[@]}"; then exit 0; fi
            echo "::warning::macOS build attempt ${attempt} failed."
            [ "$attempt" = 2 ] && exit 1
            for d in $(hdiutil info 2>/dev/null | awk '/^\/dev\/disk/{print $1}'); do hdiutil detach -force "$d" >/dev/null 2>&1 || true; done
            rm -rf release
            sleep 15
          done

      - name: Check the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg); zips=(release/*-mac.zip)
          [ ${#dmgs[@]} -gt 0 ] || { echo "::error::No .dmg was built."; exit 1; }
          [ ${#zips[@]} -gt 0 ] || { echo "::error::No mac .zip (needed by the updater) was built."; exit 1; }
          [ -f release/latest-mac.yml ] || { echo "::error::latest-mac.yml is missing."; exit 1; }
          app=$(find release -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::No .app bundle in release/."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          for f in "${dmgs[@]}"; do hdiutil verify "$f"; done
          # The native modules must be built for the app's architecture.
          want=$(uname -m)
          while IFS= read -r -d '' module; do
            # Prebuilt binaries for other systems ride along in some packages
            # (prebuilds/, skipped); the ones loaded must be this runner's
            # architecture (arm64 on Apple silicon, x86_64 on Intel).
            file -b "$module" | grep -q Mach-O || continue
            archs=$(lipo -archs "$module" 2>/dev/null || echo unknown)
            echo "$module: $archs"
            case " $archs " in *" $want "*) ;; *) echo "::error::$module isn't built for $want."; exit 1 ;; esac
          done < <(find "$app" -name '*.node' -not -path '*/prebuilds/*' -print0)

      # Both Mac runners write latest-mac.yml: the Intel one is renamed here
      # and merged into the Apple silicon one when the release is put
      # together, so the artifacts don't overwrite each other.
      - name: Keep the Intel Mac's updater file apart
        if: runner.os == 'macOS' && runner.arch == 'X64'
        shell: bash
        run: mv release/latest-mac.yml release/latest-mac-x64.yml

      - name: Rename release files for this runner
        shell: bash
        run: |
          cd release 2>/dev/null || exit 0
          
          shopt -s nullglob
          
          for f in *\ *; do
            if [ -f "$f" ]; then
              mv "$f" "${f// /-}"
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: release

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS_SHA: ${{ needs.prepare.outputs.previous }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # Banner generation is optional and must not block publishing artifacts.
      - name: Install Playwright
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/lokal-banner" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/lokal-banner/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Generate Release Banner
        id: banner
        env:
          NODE_PATH: ${{ runner.temp }}/lokal-banner/node_modules
          # Read via process.env rather than interpolated into the JS source.
          RELEASE_TAG: ${{ env.TAG }}
          RELEASE_DOWNLOAD_TAG: ${{ inputs.publish && 'desktop' || env.TAG }}
        run: |
          # Drawn from this repo (.github/banner): the outside page it used to
          # be taken from stopped answering. Never fails the job.
          # (A build of an older commit doesn't have the drawing: no banner then.)
          if [ -f .github/banner/render.js ]; then
            BANNER_VERSION="$RELEASE_TAG" BANNER_TYPE=release node .github/banner/render.js
          fi
          # The release starts as a draft, and GitHub doesn't serve a draft's
          # files: a link to its own release-banner.png showed as a broken
          # image in the draft and in the Discord message sent now (the
          # nightly, published at once, never had the problem). So the banner
          # is also committed to the "release-banners" branch, and linked
          # from there by commit (an address that works at once and never
          # changes). The release keeps its copy of the file too.
          URL=""
          if [ -f release-banner.png ]; then
            URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_DOWNLOAD_TAG/release-banner.png"
            (
              set -e
              export GIT_INDEX_FILE="$RUNNER_TEMP/banner-index"
              rm -f "$GIT_INDEX_FILE"
              PARENT=""
              if git fetch --quiet --depth=1 origin refs/heads/release-banners 2>/dev/null; then
                PARENT=$(git rev-parse FETCH_HEAD)
                git read-tree "$PARENT"
              fi
              BLOB=$(git hash-object -w release-banner.png)
              git update-index --add --cacheinfo "100644,$BLOB,$RELEASE_TAG.png"
              TREE=$(git write-tree)
              COMMIT=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "Banner for $RELEASE_TAG")
              git push --quiet origin "$COMMIT:refs/heads/release-banners"
              echo "https://raw.githubusercontent.com/${{ github.repository }}/$COMMIT/$RELEASE_TAG.png" > "$RUNNER_TEMP/banner-url"
            ) && URL=$(cat "$RUNNER_TEMP/banner-url") \
              || echo "::warning title=Release banner::Couldn't save the banner to the release-banners branch: the draft and Discord will link the release's own copy, which shows once the release is published."
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Only reference the banner in the release body when it exists, so
          # a skipped banner doesn't leave a broken image at the top.
          if [ -n "$URL" ]; then
            echo "md=![Release Banner]($URL)" >> "$GITHUB_OUTPUT"
          else
            echo "md=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: release-*

      - name: Aggregate artifacts into release_all
        shell: bash
        run: |
          mkdir -p release_all
          shopt -s nullglob
          for d in artifacts/*; do
            if [ -d "$d" ]; then
              cp -R "$d"/* release_all/ || true
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null)" ]; then
            mkdir -p release_all
            touch release_all/.no_files
          fi

      - name: Merge the macOS updater files
        shell: bash
        run: node scripts/merge-latest-mac.mjs release_all

      - name: Generate checksums for all artifacts
        id: checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD='sha256sum'
          else
            SHACMD='shasum -a 256'
          fi

          echo "HASHES<<EOF" >> $GITHUB_OUTPUT
          for f in release_all/*; do
            if [ -f "$f" ] && [ "$(basename "$f")" != ".no_files" ]; then
              HASH=$($SHACMD "$f" | awk '{print toupper($1)}')
              NAME=$(basename "$f")
              echo "> **$NAME**: \`[$HASH]\`" >> $GITHUB_OUTPUT
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null | grep -v .no_files)" ]; then
            echo "No release files found" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get latest commit message (single)
        id: latest_commit
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "LATEST<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v8
        with:
          script: |
            // Compare pinned source commits: rolling release tags move, and
            // superseded version tags are removed after publication.
            const { execSync } = require('child_process');
            const sh = (cmd) => execSync(cmd).toString();
            const tag = process.env.TAG;
            const parts = (t) => t.replace(/^v/, '').split(/[.-]/).map(n => parseInt(n, 10)).filter(n => !Number.isNaN(n));
            const below = (a, b) => {
              const x = parts(a), y = parts(b);
              for (let i = 0; i < Math.max(x.length, y.length); i++) {
                if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0);
              }
              return false;
            };
            const previous = process.env.PREVIOUS_SHA || sh("git tag --list 'v*'").split('\n')
              .map(t => t.trim())
              .filter(t => /^v\d+(\.\d+)*$/.test(t) && below(t, tag))
              .sort((a, b) => (below(a, b) ? 1 : -1))[0];
            core.info(`Release notes for ${tag}, since ${previous || 'the first commit'}`);
            const { owner, repo } = context.repo;

            // One entry per PR merged since then (oldest first), with its
            // description folded under it, ready to be tidied in the draft.
            // Version bump PRs and the bump commit itself are left out.
            const notes = async () => {
              if (!previous) throw new Error('no previous version');
              const lines = sh(`git log --first-parent --reverse --format=%H%x09%s ${previous}..HEAD`)
                .split('\n').filter(Boolean).map(l => l.split('\t'));
              const entries = [];
              const contributors = new Set();
              for (const [sha, subject] of lines) {
                const m = subject.match(/^Merge pull request #(\d+)/) || subject.match(/\(#(\d+)\)$/);
                if (!m) {
                  if (!/^Version \d+\.\d+\.\d+$/.test(subject)) entries.push(`- ${subject} (${sha.slice(0, 7)})`);
                  continue;
                }
                const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(m[1]) });
                if (/^(chore\/)?version-/.test(pr.head.ref) || /^Version \d+\.\d+\.\d+$/.test(pr.title)) continue;
                contributors.add(pr.user.login);
                const body = (pr.body || '')
                  .split('\n')
                  .filter(l => !/Generated with \[Claude Code\]|claude\.ai\/code\/session_|^Co-Authored-By:/i.test(l))
                  .join('\n').trim();
                entries.push(`- **${pr.title}** ([#${pr.number}](${pr.html_url}))` +
                  (body ? `\n  <details><summary>Details</summary>\n\n${body.replace(/^/gm, '  ')}\n\n  </details>` : ''));
              }
              if (!entries.length) throw new Error('no changes found');
              return [
                "## What's Changed",
                '',
                ...entries,
                '',
                contributors.size ? `Contributors: ${[...contributors].map(u => '@' + u).join(', ')}` : '',
                '',
                `**Full Changelog**: https://github.com/${owner}/${repo}/compare/${previous}...${process.env.GITHUB_SHA}`,
              ].join('\n');
            };

            let body;
            try {
              body = await notes();
            } catch (err) {
              // Neither endpoint needs a version tag to exist. A manually
              // selected rebuild can also have no commits since publication.
              core.warning(`Writing release notes from PRs failed (${err.message}); using commit subjects.`);
              const subjects = sh(previous ? `git log --format=%s ${previous}..HEAD` : 'git log -20 --format=%s').trim();
              body = "## What's Changed\n\n" + (subjects ? subjects.split('\n').map(s => `- ${s}`).join('\n') : '- Maintenance release.');
            }
            core.setOutput('body', body);

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Desktop — ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: |
            release_all/**/*.exe
            release_all/**/*.dmg
            release_all/**/*.AppImage
            release_all/**/*.deb
            release_all/**/*.zip
            release_all/**/latest*.yml
            release-banner.png
          draft: true
          body: |
            ${{ steps.banner.outputs.md }}

            ${{ steps.latest_commit.outputs.LATEST }}

            ---

            ## Changelog

            Windows builds: free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/) ([code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)).

            FYI:
            **Lokal is 100% local; the library, history, anything in database, or any info that is used for API's such as yt-dlp, LRCLIB, is *NOT* seen by us.**

            ${{ steps.release_notes.outputs.body }}

            ---

            ## Setup

            See [README.md](./README.md) for full setup instructions.

            ${{ secrets.CSC_LINK == '' && '**macOS:** this build is ad-hoc signed, not notarized (no Developer ID certificate is configured). The first time, right-click Lokal in Applications and choose Open, or run `xattr -dr com.apple.quarantine /Applications/Lokal.app`.' || '' }}

            ---

            ### Binary Checksums (SHA-256)

            ${{ steps.checksums.outputs.HASHES }}

      - name: Publish the rolling desktop release and clean old tags
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          STAGED_RELEASE_ID: ${{ steps.create_release.outputs.id }}
        run: python3 scripts/desktop_releases.py promote --release-id "$STAGED_RELEASE_ID" --tag "$TAG" --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"

      - name: Discord Notification (Build Complete)
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          LATEST_MSG: ${{ steps.latest_commit.outputs.LATEST }}
          BANNER_URL: ${{ steps.banner.outputs.url }}
          RELEASE_URL: ${{ inputs.publish && format('https://github.com/{0}/releases/tag/desktop', github.repository) || steps.create_release.outputs.html_url }}
          RELEASE_STATUS: ${{ inputs.publish && 'Published' || 'Draft Ready' }}
          RELEASE_DOWNLOAD_TAG: ${{ inputs.publish && 'desktop' || env.TAG }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          BANNER_URL="${BANNER_URL:-https://github.com/${{ github.repository }}/releases/download/$RELEASE_DOWNLOAD_TAG/release-banner.png}"
          
          PAYLOAD=$(jq -n \
            --arg version "${{ env.TAG }}" \
            --arg url "$RELEASE_URL" \
            --arg status "$RELEASE_STATUS" \
            --arg msg "$LATEST_MSG" \
            --arg image "$BANNER_URL" \
            --arg footer_icon "https://i.imgur.com/ZC3mEUC.png" \
            --argjson color 3447003 \
            '{
              embeds: [{
                title: "Build Complete: Lokal \($version)",
                description: "All platform binaries for version **\($version)** have been successfully built and uploaded. \n\n**Status:** \($status)\n**Last Commit:** \($msg)",
                url: $url,
                color: $color,
                image: { url: $image },
                footer: { text: "Lokal Build System", icon_url: $footer_icon }
              }]
            }'
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
