name: Download library integrity

on:
  pull_request:
    paths:
      - 'electron/download/**'
      - 'electron/downloadFolder.js'
      - 'electron/ipc/scanner.js'
      - 'electron/ipc/mergeDuplicates.js'
      - 'electron/ipc/walkMusicFiles.js'
      - 'electron/libraryWatcher.js'
      - 'electron/quality/**'
      - 'electron/recordingIdentity.js'
      - 'electron/libraryOwned.js'
      - 'electron/libraryPathIdentity.js'
      - 'electron/mergeTrackReferences.js'
      - 'electron/duplicateGroups.js'
      - 'electron/trackAlias.js'
      - 'src/mergedTracks.js'
      - 'src/ghostDownloads.js'
      - 'scripts/ghost-downloads.test.mjs'
      - 'scripts/download-integrity.test.mjs'
      - 'scripts/library-duplicates.test.mjs'
      - 'scripts/startup-library-repair.test.mjs'
      - 'scripts/library-watch.test.mjs'
      - '.github/workflows/download-integrity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downloads:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The third-party setup-ffmpeg action broke on Ubuntu by parsing an
      # upstream README as a version ("Failed to read version from readme").
      # Use runner-native package managers rather than an external parser.
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
      - name: Verify FFmpeg
        run: ffmpeg -version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild better-sqlite3
      - name: Test real audio, watcher races, deduplication, conversion and reference repair
        env:
          ELECTRON_OVERRIDE_DIST_PATH: ${{ runner.temp }}/unused-electron
        run: node --test scripts/download-integrity.test.mjs scripts/download-library-sync.test.mjs scripts/library-duplicates.test.mjs scripts/alac-codec.test.mjs scripts/atmos-library-quality.test.mjs scripts/http-addon-downloads.test.mjs scripts/lastwave-download-artwork.test.mjs scripts/ghost-downloads.test.mjs scripts/startup-library-repair.test.mjs scripts/library-watch.test.mjs
