name: Linux FFmpeg archive extraction

on:
  pull_request:
    paths:
      - 'electron/ipc/tools.js'
      - 'electron/ipc/systemTar.js'
      - 'scripts/linux-ffmpeg-extraction.test.mjs'
      - '.github/workflows/linux-ffmpeg-extraction.yml'
  push:
    branches: [main]
    paths:
      - 'electron/ipc/tools.js'
      - 'electron/ipc/systemTar.js'
      - 'scripts/linux-ffmpeg-extraction.test.mjs'
      - '.github/workflows/linux-ffmpeg-extraction.yml'

permissions:
  contents: read

jobs:
  test:
    name: Extract FFmpeg archive on Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Test system tar extraction
        run: node --test scripts/linux-ffmpeg-extraction.test.mjs
