name: Build Windows Update

on:
  push:
    branches:
      - 4k-fork-new
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: '4k-fork-new'

permissions:
  contents: read

concurrency:
  group: windows-update-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows updater
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set upstream patch version for fork branch
        if: inputs.ref == '4k-fork-new' || (github.event_name == 'push' && github.ref == 'refs/heads/4k-fork-new')
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/lokal-music/desktop.git
          git fetch --no-tags upstream \
            refs/heads/main:refs/remotes/upstream/main

          UPSTREAM_VERSION=$(git show upstream/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if ! [[ "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable upstream x.y.z package version, got $UPSTREAM_VERSION."
            exit 1
          fi
          NEW=$(node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            console.log(`${major}.${minor}.${patch + 1}`)
          ' "$UPSTREAM_VERSION")

          NEW="$NEW" node -e '
            const fs = require("fs")
            const next = process.env.NEW
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"))
            if (!lock.packages || !lock.packages[""]) throw new Error("package-lock.json is missing its root package entry")
            pkg.version = next
            lock.version = next
            lock.packages[""].version = next
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n")
            const readme = fs.readFileSync("README.md", "utf8")
            const updated = readme.replace(/version-[0-9]+\.[0-9]+\.[0-9]+-blue/, `version-${next}-blue`)
            if (updated === readme) throw new Error("README.md does not contain a version badge")
            fs.writeFileSync("README.md", updated)
          '
          echo "Building fork branch with upstream patch version $NEW."

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid package version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building Windows updater for v$VERSION from $(git rev-parse --short HEAD)."

      - name: Setup Rust for Windows SMTC bridge
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup .NET for the Windows sign-in helper
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: npm install

      - name: Check native build dependencies
        shell: bash
        run: |
          node scripts/check-build-natives.cjs && exit 0
          echo "::warning::A native build package is missing; retrying npm install."
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/check-build-natives.cjs

      - name: Build Windows NSIS updater
        run: npm run build -- --win nsis --x64 --publish never '-c.nsis.artifactName=${productName}-Setup-${version}.${ext}'

      - name: Verify Windows updater files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          installer="release/Lokal-Setup-${VERSION}.exe"
          blockmap="${installer}.blockmap"
          [ -f "$installer" ] || { echo "::error::Expected Windows installer $installer was not built."; exit 1; }
          [ -f "$blockmap" ] || { echo "::error::Expected Windows update blockmap $blockmap was not built."; exit 1; }
          [ -f release/latest.yml ] || { echo "::error::latest.yml is missing."; exit 1; }
          grep -Fq "Lokal-Setup-${VERSION}.exe" release/latest.yml || { echo "::error::latest.yml does not point to the expected installer."; exit 1; }
          ls -l "$installer" "$blockmap" release/latest.yml

      - name: Keep Windows updater files as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-update-${{ steps.version.outputs.version }}
          path: |
            release/Lokal-Setup-${{ steps.version.outputs.version }}.exe
            release/Lokal-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.version.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes "Windows update build for $TAG." \
              --target "$TARGET_SHA" \
              --repo "$REPOSITORY"
          fi
          gh release upload "$TAG" \
            "release/Lokal-Setup-${VERSION}.exe" \
            "release/Lokal-Setup-${VERSION}.exe.blockmap" \
            release/latest.yml \
            --repo "$REPOSITORY" \
            --clobber
          gh release edit "$TAG" --draft=false --repo "$REPOSITORY"
