name: Build Windows Update

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build'
        required: true
        default: '4k-fork-new'

permissions:
  contents: read

concurrency:
  group: windows-update-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows updater
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid package version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building Windows updater for v$VERSION from $(git rev-parse --short HEAD)."

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust for Windows SMTC bridge
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup .NET for the Windows sign-in helper
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: npm install

      - name: Check native build dependencies
        shell: bash
        run: |
          node scripts/check-build-natives.cjs && exit 0
          echo "::warning::A native build package is missing; retrying npm install."
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/check-build-natives.cjs

      - name: Build Windows NSIS updater
        run: npm run build -- --win nsis --x64 --publish never

      - name: Verify Windows updater files
        shell: bash
        run: |
          shopt -s nullglob
          installers=(release/*.exe)
          blockmaps=(release/*.blockmap)
          [ ${#installers[@]} -gt 0 ] || { echo "::error::No Windows installer was built."; exit 1; }
          [ ${#blockmaps[@]} -gt 0 ] || { echo "::error::No Windows update blockmap was built."; exit 1; }
          [ -f release/latest.yml ] || { echo "::error::latest.yml is missing."; exit 1; }
          ls -l "${installers[@]}" "${blockmaps[@]}" release/latest.yml

      - name: Keep Windows updater files as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-update-${{ steps.version.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.version.outputs.sha }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "Release $TAG" \
              --notes "Windows update build for $TAG." \
              --target "$TARGET_SHA"
          fi
          gh release upload "$TAG" \
            release/*.exe \
            release/*.blockmap \
            release/latest.yml \
            --clobber
