name: Build Windows Update

on:
  push:
    branches:
      - 4k-fork-new
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build and increment'
        required: true
        default: '4k-fork-new'

permissions:
  contents: read

concurrency:
  group: windows-update-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows updater
    # The sync workflow dispatches this build after its version commit. Ignore
    # that push-triggered run so each update advances the patch only once.
    if: >-
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'Version ') &&
       !startsWith(github.event.head_commit.message, 'Windows build version '))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Increment and persist Windows patch version
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "$BUILD_REF" >/dev/null; then
            echo "::error::Windows update builds must target a branch so the incremented version can be persisted: $BUILD_REF"
            exit 1
          fi

          git fetch origin "$BUILD_REF"
          git checkout -B "$BUILD_REF" "origin/$BUILD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm version patch --no-git-tag-version --ignore-scripts
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/version-[0-9]+\.[0-9]+\.[0-9]+-blue/version-$VERSION-blue/" README.md
          git add package.json package-lock.json README.md
          git commit -m "Windows build version $VERSION"
          git push origin "HEAD:refs/heads/$BUILD_REF"
          echo "Windows updater version advanced to $VERSION."

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid package version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building Windows updater for v$VERSION from $(git rev-parse --short HEAD)."

      - name: Setup Rust for Windows SMTC bridge
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup .NET for the Windows sign-in helper
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: npm install

      - name: Check native build dependencies
        shell: bash
        run: |
          node scripts/check-build-natives.cjs && exit 0
          echo "::warning::A native build package is missing; retrying npm install."
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/check-build-natives.cjs

      - name: Build Windows NSIS updater
        run: npm run build -- --win nsis --x64 --publish never '-c.nsis.artifactName=${productName}-Setup-${version}.${ext}'

      - name: Verify Windows updater files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          installer="release/Lokal-Setup-${VERSION}.exe"
          blockmap="${installer}.blockmap"
          [ -f "$installer" ] || { echo "::error::Expected Windows installer $installer was not built."; exit 1; }
          [ -f "$blockmap" ] || { echo "::error::Expected Windows update blockmap $blockmap was not built."; exit 1; }
          [ -f release/latest.yml ] || { echo "::error::latest.yml is missing."; exit 1; }
          grep -Fq "Lokal-Setup-${VERSION}.exe" release/latest.yml || { echo "::error::latest.yml does not point to the expected installer."; exit 1; }
          ls -l "$installer" "$blockmap" release/latest.yml

      - name: Keep Windows updater files as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-update-${{ steps.version.outputs.version }}
          path: |
            release/Lokal-Setup-${{ steps.version.outputs.version }}.exe
            release/Lokal-Setup-${{ steps.version.outputs.version }}.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Create or update the GitHub release
        shell: bash
        env:
          # Set this secret when repository/org policy blocks GITHUB_TOKEN from creating releases.
          GH_TOKEN: ${{ secrets.WINDOWS_UPDATE_RELEASE_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.version.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes "Windows update build for $TAG." \
              --target "$TARGET_SHA" \
              --repo "$REPOSITORY"
          fi
          gh release upload "$TAG" \
            "release/Lokal-Setup-${VERSION}.exe" \
            "release/Lokal-Setup-${VERSION}.exe.blockmap" \
            release/latest.yml \
            --repo "$REPOSITORY" \
            --clobber
          gh release edit "$TAG" --draft=false --repo "$REPOSITORY"
