name: Build Lokal (Windows Test)

# on:
#   workflow_dispatch:
#     inputs:
#       ref:
#         description: 'Git Ref/Tag/Commit to build'
#         required: false
#         default: 'main'
#   push:
#     branches: [ main ]
#   pull_request:
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (for Windows SMTC bridge)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup .NET (for Windows sign-in helper)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build -- --publish never

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v6
        with:
          name: lokal-windows-build
          path: |
            release/*.exe
        #   release/*.zip
