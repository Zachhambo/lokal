name: Renderer startup

on:
  pull_request:
    paths:
      - 'src/App.jsx'
      - 'src/audio/addonVerification.mjs'
      - 'scripts/addon-verification-playback.test.mjs'
      - 'src/mobileLinkedTracks.js'
      - 'src/components/TrackList.jsx'
      - 'src/pages/Playlist.jsx'
      - 'server/routes/playlists.js'
      - 'scripts/mobile-linked-playback.test.mjs'
      - 'src/components/DownloadManager.jsx'
      - 'src/main.jsx'
      - 'src/pages/Home.jsx'
      - 'src/components/RightSidebar.jsx'
      - 'src/performanceStalls.mjs'
      - 'electron/ipc/scanner.js'
      - 'electron/download/manager.js'
      - 'scripts/startup-responsiveness.test.mjs'
      - 'src/RenderErrorBoundary.jsx'
      - 'src/mergedTracks.js'
      - 'src/store/player.js'
      - 'src/queueStorage.js'
      - 'src/**/*.jsx'
      - 'scripts/jsx-bindings.test.mjs'
      - 'vite.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/renderer-startup-browser.test.mjs'
      - '.github/workflows/renderer-startup-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated browser test dependency
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/startup-browser" --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Validate post-render stalls, bounded Home requests and route splitting
        run: node --test scripts/startup-responsiveness.test.mjs
      - name: Check renderer JSX component bindings
        run: npm run test:jsx-bindings
      - name: Verify synced mobile likes and desktop source downloads
        run: node --experimental-sqlite --test scripts/mobile-linked-playback.test.mjs scripts/ghost-downloads.test.mjs scripts/recommendation-downloads.test.mjs
      - name: Verify direct provider authentication and playback output stability
        run: node --test scripts/addon-verification-playback.test.mjs
      - run: npm run gen:icons
      - name: Check the production renderer with fresh, empty and restored queues
        env:
          NODE_PATH: ${{ runner.temp }}/startup-browser/node_modules
        run: node --test scripts/renderer-startup-browser.test.mjs
