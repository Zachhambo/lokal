name: Build Lokal Nightly

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git Ref/Tag/Commit to build'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: release-lokal
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    # Works out the nightly version once and pins the commit, so the three
    # build runners (and the release) use the same version from the same tag
    # snapshot, even if main or the tags move while they run.
    name: Work out the nightly version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      sha: ${{ steps.calc.outputs.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Calculate the nightly version
        id: calc
        env:
          # Through the environment, not pasted into the script: a ref is user input.
          REF: ${{ inputs.ref || 'main' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git show "$GITHUB_SHA:scripts/desktop_releases.py" > "$RUNNER_TEMP/desktop_releases.py"
          python3 "$RUNNER_TEMP/desktop_releases.py" nightly

  build:
    name: Build (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        # Linux stays on a fixed, older Ubuntu: native modules compiled here
        # only run on systems at least this new, so a newer image would
        # lock older distros out of the AppImage/deb.
        # ubuntu-24.04-arm: the Linux AppImage/deb for ARM64 (Raspberry Pi 5,
        # ARM laptops), built natively there; its files carry "arm64" and the
        # updater reads latest-linux-arm64.yml, so nothing clashes with x64.
        # macos-latest builds for Apple silicon (arm64), macos-15-intel for
        # Intel Macs (x64): each natively, so native modules match. Their
        # files don't clash (the arm64 ones carry "arm64"); the updater files
        # are merged into one latest-mac.yml (scripts/merge-latest-mac.mjs).
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # The commit the version was worked out from, not wherever the ref
          # points now.
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (for Windows SMTC bridge)
        # Must run before "Install Dependencies": this repo's postinstall
        # script (electron-builder install-app-deps && npm run
        # native:prepare) invokes `cargo build` for the SMTC bridge addon
        # as part of `npm install` itself, so cargo has to already be on
        # PATH by then, not just before a later separate build step.
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup .NET (for the Windows sign-in helper)
        # npm install builds tools/webview2-signin (the YouTube Music
        # sign-in window in Microsoft Edge WebView2) through native:prepare.
        if: matrix.os == 'windows-latest'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: npm install

      # npm skips an optional package whose download fails (it happens on a
      # cold npm cache) and carries on, which left Windows without
      # lightningcss-win32-x64-msvc and failed the vite build. A second
      # install fetches whatever is missing; the check fails the job early
      # if that didn't help.
      - name: Check the build tools' native parts
        shell: bash
        run: |
          node scripts/check-build-natives.cjs && exit 0
          echo "::warning::A native build package is missing after npm install; installing again."
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/check-build-natives.cjs

      - name: Mark this build as a nightly version
        # The version was worked out once, in the "version" job, so every
        # runner builds the same one. Only this build's copy of package.json
        # is changed; nothing is committed.
        shell: bash
        run: |
          npm pkg set version="${{ needs.version.outputs.version }}"
          echo "Building nightly version $(node -p "require('./package.json').version")"

      # The Windows build also makes the Microsoft Store MSIX. Its identity
      # comes from package.json (build.appx), matching Partner Center's
      # Product identity; the MSIX_IDENTITY_NAME, MSIX_PUBLISHER and
      # MSIX_PUBLISHER_DISPLAY_NAME repository variables override it if set.
      # The MSIX is left unsigned: the Store signs it.
      - name: Build Application
        if: runner.os != 'macOS'
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          ARGS=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$MSIX_IDENTITY_NAME" ]; then ARGS+=(-c.appx.identityName "$MSIX_IDENTITY_NAME"); fi
            if [ -n "$MSIX_PUBLISHER" ]; then ARGS+=(-c.appx.publisher "$MSIX_PUBLISHER"); fi
            if [ -n "$MSIX_PUBLISHER_DISPLAY_NAME" ]; then ARGS+=(-c.appx.publisherDisplayName "$MSIX_PUBLISHER_DISPLAY_NAME"); fi
          fi
          npm run build -- --publish never -c.detectUpdateChannel=false "${ARGS[@]}"

      - name: Check the MSIX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          shopt -s nullglob
          msix=(release/*.msix)
          [ ${#msix[@]} -gt 0 ] || { echo "::error::No .msix was built."; exit 1; }
          ls -l "${msix[@]}"

      # The MSIX is unsigned (the Store signs it), so Windows won't install a
      # downloaded copy: it's kept as a workflow artifact for uploading to
      # Partner Center, not published on the GitHub release.
      - name: Upload the Store MSIX
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: store-msix
          path: release/*.msix
          if-no-files-found: error

      - name: Keep the MSIX off the release
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f release/*.msix

      - name: Verify AppImage libvips resolver tests
        if: runner.os == 'Linux'
        run: node --test scripts/check-linux-sharp-appimage.test.cjs

      # Verify the actual AppImage, not just installed node_modules.
      # Missing libvips made AppImages fail on CachyOS (sipbuu/lokal#521).
      - name: Verify Sharp and libvips inside AppImage
        if: runner.os == 'Linux'
        run: node scripts/check-linux-sharp-appimage.cjs release

      # macOS: two runners (Apple silicon and Intel). Signing only happens
      # when the certificate secrets exist: an empty CSC_LINK makes
      # electron-builder read the project folder as the certificate ("not a
      # file") and fail, which is what broke the mac build in #277. Without
      # them, the app is signed ad-hoc (see below).
      # DMG creation (hdiutil) fails now and then on hosted runners with
      # "Resource busy"; one clean retry covers it.
      - name: Build Application (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          SIGN_ARGS=()
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            echo "Signing with the configured certificate."
          else
            # Ad-hoc signature over the whole bundle. Without it the app kept
            # Electron's stale signature ("code has no resources but signature
            # indicates they must be present"), which macOS reports as a
            # damaged app on Apple silicon. The hardened runtime only matters
            # for notarization, and with an ad-hoc signature it makes macOS
            # refuse to load the app's own native modules.
            SIGN_ARGS=(-c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false)
            echo "No signing certificate configured; signing ad-hoc."
          fi
          for attempt in 1 2; do
            if npm run build -- --publish never -c.detectUpdateChannel=false "${SIGN_ARGS[@]}"; then exit 0; fi
            echo "::warning::macOS build attempt ${attempt} failed."
            [ "$attempt" = 2 ] && exit 1
            for d in $(hdiutil info 2>/dev/null | awk '/^\/dev\/disk/{print $1}'); do hdiutil detach -force "$d" >/dev/null 2>&1 || true; done
            rm -rf release
            sleep 15
          done

      - name: Check the macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg); zips=(release/*-mac.zip)
          [ ${#dmgs[@]} -gt 0 ] || { echo "::error::No .dmg was built."; exit 1; }
          [ ${#zips[@]} -gt 0 ] || { echo "::error::No mac .zip (needed by the updater) was built."; exit 1; }
          [ -f release/latest-mac.yml ] || { echo "::error::latest-mac.yml is missing."; exit 1; }
          app=$(find release -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::No .app bundle in release/."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          for f in "${dmgs[@]}"; do hdiutil verify "$f"; done
          # The native modules must be built for the app's architecture.
          want=$(uname -m)
          while IFS= read -r -d '' module; do
            # Prebuilt binaries for other systems ride along in some packages
            # (prebuilds/, skipped); the ones loaded must be this runner's
            # architecture (arm64 on Apple silicon, x86_64 on Intel).
            file -b "$module" | grep -q Mach-O || continue
            archs=$(lipo -archs "$module" 2>/dev/null || echo unknown)
            echo "$module: $archs"
            case " $archs " in *" $want "*) ;; *) echo "::error::$module isn't built for $want."; exit 1 ;; esac
          done < <(find "$app" -name '*.node' -not -path '*/prebuilds/*' -print0)

      # Both Mac runners write latest-mac.yml: the Intel one is renamed here
      # and merged into the Apple silicon one when the release is put
      # together, so the artifacts don't overwrite each other.
      - name: Keep the Intel Mac's updater file apart
        if: runner.os == 'macOS' && runner.arch == 'X64'
        shell: bash
        run: mv release/latest-mac.yml release/latest-mac-x64.yml

      - name: Rename release files for this runner
        shell: bash
        run: |
          cd release 2>/dev/null || exit 0
          
          shopt -s nullglob
          
          for f in *\ *; do
            if [ -f "$f" ]; then
              mv "$f" "${f// /-}"
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: release

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # The commit the version was worked out from, not wherever the ref
          # points now.
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # Banner generation is optional and must not block publishing artifacts.
      - name: Install Playwright
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/lokal-banner" --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/lokal-banner/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Get Last Commit Info
        id: commit_info
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_DATE=$(git log -1 --format="%cd" --date=format:'%Y-%m-%d %H:%M:%S UTC')
          
          echo "MSG=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "DATE=$COMMIT_DATE" >> $GITHUB_OUTPUT
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Generate Nightly Banner
        id: banner
        env:
          NODE_PATH: ${{ runner.temp }}/lokal-banner/node_modules
          # Passed through the environment and read via process.env below
          # instead of interpolated straight into the JS source -- inputs.ref
          # is a write-authorized but still user-controlled string, and a ref
          # containing quote/statement syntax would otherwise land in this
          # heredoc as executable code (CWE-94) rather than as data.
          NIGHTLY_REF: ${{ inputs.ref || 'main' }}
          NIGHTLY_TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Drawn from this repo (.github/banner): the outside page it used to
          # be taken from stopped answering. Never fails the job.
          # (A build of an older commit doesn't have the drawing: no banner then.)
          if [ -f .github/banner/render.js ]; then
            BANNER_VERSION="$NIGHTLY_TAG" BANNER_TYPE=nightly BANNER_REF="$NIGHTLY_REF" node .github/banner/render.js
          fi
          # The release is re-created each run (see below), so only link a
          # banner this run actually made.
          if [ -f release-banner.png ]; then
            echo "md=![Release Banner](https://github.com/${{ github.repository }}/releases/download/nightly/release-banner.png)" >> "$GITHUB_OUTPUT"
          else
            echo "md=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: release-*

      - name: Aggregate artifacts into release_all
        shell: bash
        run: |
          mkdir -p release_all
          shopt -s nullglob
          for d in artifacts/*; do
            if [ -d "$d" ]; then
              cp -R "$d"/* release_all/ || true
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null)" ]; then
            mkdir -p release_all
            touch release_all/.no_files
          fi

      - name: Merge the macOS updater files
        shell: bash
        run: node scripts/merge-latest-mac.mjs release_all

      - name: Generate checksums for all artifacts
        id: checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD='sha256sum'
          else
            SHACMD='shasum -a 256'
          fi

          echo "HASHES<<EOF" >> $GITHUB_OUTPUT
          for f in release_all/*; do
            if [ -f "$f" ] && [ "$(basename "$f")" != ".no_files" ]; then
              HASH=$($SHACMD "$f" | awk '{print toupper($1)}')
              NAME=$(basename "$f")
              echo "> **$NAME**: \`[$HASH]\`" >> $GITHUB_OUTPUT
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null | grep -v .no_files)" ]; then
            echo "No release files found" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Nightly Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ steps.commit_info.outputs.SHA }}
          name: "Lokal Nightly (${{ inputs.ref || 'main' }})"
          prerelease: true
          draft: true
          files: |
            release_all/**/*.exe
            release_all/**/*.dmg
            release_all/**/*.AppImage
            release_all/**/*.deb
            release_all/**/*.zip
            release_all/**/latest*.yml
            release-banner.png
          body: |
            ${{ steps.banner.outputs.md }}

            ---
            
            *This is a nightly build, code may/may not be fully functional.*
            Last commit note/date: `${{ steps.commit_info.outputs.MSG }}` at `${{ steps.commit_info.outputs.DATE }}`

            ---

            FYI:
            **Lokal is 100% local; the library, history, anything in database, or any info that is used for API's such as yt-dlp, LRCLIB, is *NOT* seen by us.**

            ---

            ## Setup

            See [README.md](./README.md) for full setup instructions.

            ${{ secrets.CSC_LINK == '' && '**macOS:** this build is ad-hoc signed, not notarized (no Developer ID certificate is configured). The first time, right-click Lokal in Applications and choose Open, or run `xattr -dr com.apple.quarantine /Applications/Lokal.app`.' || '' }}

            ---

            ### Binary Checksums (SHA-256)

            ${{ steps.checksums.outputs.HASHES }}

      - name: Publish the rolling nightly and clean old tags
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ needs.version.outputs.sha }}
          STAGED_RELEASE_ID: ${{ steps.create_release.outputs.id }}
        run: |
          git show "$GITHUB_SHA:scripts/desktop_releases.py" > "$RUNNER_TEMP/desktop_releases.py"
          python3 "$RUNNER_TEMP/desktop_releases.py" promote --release-id "$STAGED_RELEASE_ID" --channel nightly --tag "$STAGED_TAG" --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"

      - name: Discord Notification (Build Complete)
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          # DISCORD_WEBHOOK lives in the upstream repo's secrets, not every
          # fork's -- an empty/unset secret makes curl's URL argument empty,
          # which curl rejects outright ("URL rejected: Malformed input to a
          # URL function", exit 3). By this point the actual release has
          # already been created above, so a missing or unreachable webhook
          # is a cosmetic notification failing, not a real problem -- don't
          # let it fail the job.
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set on this repo -- skipping Discord notification."
            exit 0
          fi

          BANNER_URL="https://github.com/${{ github.repository }}/releases/download/nightly/release-banner.png"

          PAYLOAD=$(jq -n \
            --arg version "Nightly (${{ inputs.ref || 'main' }})" \
            --arg url "https://github.com/${{ github.repository }}/releases/tag/nightly" \
            --arg msg "${{ steps.commit_info.outputs.MSG }}" \
            --arg image "$BANNER_URL" \
            --arg footer_icon "https://i.imgur.com/ZC3mEUC.png" \
            --argjson color 15105570 \
            '{
              embeds: [{
                title: "Build Complete: Nightly Lokal \($version)",
                description: "All platform binaries for **\($version)** have been successfully built and uploaded to the nightly pre-release.\n\n**Status:** Nightly Ready\n**Last Commit:** \($msg)",
                url: $url,
                color: $color,
                image: { url: $image },
                footer: { text: "Lokal Build System", icon_url: $footer_icon }
              }]
            }'
          )

          curl -sS -f --max-time 15 -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK" \
            || echo "Discord webhook call failed (rejected or unreachable) -- not fatal, release already published above."
